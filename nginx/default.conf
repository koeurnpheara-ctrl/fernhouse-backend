# HTTP-ONLY configuration (works locally and for the very first certificate request).
# After you have SSL certificates, replace this file with nginx/default-ssl.conf
# (see DEPLOYMENT.md, step 11).

upstream frontend_app { server frontend:80; }
upstream backend_app  { server backend:5000; }

# Handy for Docker health checks
server {
    listen 80 default_server;
    server_name _;
    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Frontend: myproject.site
server {
    listen 80;
    server_name myproject.site www.myproject.site;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API + backend: api.myproject.site and backend.myproject.site
server {
    listen 80;
    server_name api.myproject.site backend.myproject.site;
    client_max_body_size 10m;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
