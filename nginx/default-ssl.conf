# HTTPS configuration. Use it AFTER you obtained certificates with Certbot:
#   cp nginx/default-ssl.conf nginx/default.conf
#   docker compose restart nginx
# Certificate folder name = first -d domain you gave Certbot (myproject.site).

upstream frontend_app { server frontend:80; }
upstream backend_app  { server backend:5000; }

# 1) HTTP: only Certbot challenges and a redirect to HTTPS
server {
    listen 80 default_server;
    server_name _;
    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# 2) Frontend: https://myproject.site
server {
    listen 443 ssl;
    http2 on;
    server_name myproject.site www.myproject.site;

    ssl_certificate     /etc/letsencrypt/live/myproject.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myproject.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3) API: https://api.myproject.site
server {
    listen 443 ssl;
    http2 on;
    server_name api.myproject.site;
    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/myproject.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myproject.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 4) Backend: https://backend.myproject.site (same Express server: admin panel at /admin/ + /uploads + /api)
server {
    listen 443 ssl;
    http2 on;
    server_name backend.myproject.site;
    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/myproject.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myproject.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
